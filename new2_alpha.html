<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML/CSS Example</title>
    <style>
        /* CSS Styles */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        
        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #446688;
            border-bottom: 2px solid #446688;
            padding-bottom: 10px;
        }
        
        .button {
            display: inline-block;
            background: #446688;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .button:hover {
            background: #334d66;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Simple Page</h1>
        <p>This is a basic example of HTML with CSS styling.</p>
        <p>Features included:</p>
        <ul>
            <li>Responsive container</li>
            <li>Styled heading</li>
            <li>Simple navigation</li>
            <li>Interactive button</li>
        </ul>
        <a href="#" class="button">Click Me</a>
    </div>
</body>
</html>
